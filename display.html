<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Serving — Queue Announcement System</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/display.css">
</head>
<body>

  <!-- ==========================================================
       SKELETON ONLY (Chunk 0).
       Full NOW SERVING layout, ticket animation, bell sound,
       last-5 list, clock, and scrolling footer get built in Chunk 5.
       ========================================================== -->

  <header class="display-header">
    <!-- Chunk 3: logo + office name populated from Settings -->
    <img id="office-logo" src="" alt="" hidden>
    <h2 id="office-name">Office Name</h2>
    <time id="clock"></time>
  </header>

  <main id="now-serving">
    <h1 class="now-serving-label">NOW SERVING</h1>
    <div id="ticket-number" class="ticket-number" aria-live="assertive">
      <!-- Chunk 5: huge current ticket number renders here -->
      —
    </div>
    <p id="counter-label" class="counter-label"><!-- e.g. "PLEASE PROCEED TO COUNTER 2" --></p>
  </main>

  <aside id="last-called" aria-label="Last called tickets">
    <h2>Last Called</h2>
    <ol id="last-called-list">
      <!-- Chunk 5: last 5 tickets render here -->
    </ol>
  </aside>

  <footer id="scrolling-footer">
    <!-- Chunk 3/5: optional scrolling message from Settings -->
  </footer>

  <audio id="bell-sound" src="assets/bell.mp3" preload="auto"></audio>

  <script type="module" src="js/comms.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/settings.js"></script>
  <script type="module" src="js/speech.js"></script>
  <script type="module" src="js/display.js"></script>
</body>
</html>
