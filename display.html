<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Serving — Queue Announcement System</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/display.css">
</head>
<body>

  <header class="display-header">
    <img id="office-logo" src="" alt="" hidden>
    <h2 id="office-name">Office Name</h2>
    <time id="clock"></time>
  </header>

  <main id="now-serving">
    <h1 class="now-serving-label">NOW SERVING</h1>
    <div id="ticket-number" class="ticket-number" aria-live="assertive">—</div>
    <p id="counter-label" class="counter-label"></p>
  </main>

  <aside id="last-called" aria-label="Last called tickets">
    <h2>Last Called</h2>
    <ol id="last-called-list"></ol>
    <p id="last-called-empty" class="empty-note">No calls yet today.</p>
  </aside>

  <footer id="scrolling-footer" hidden>
    <p id="scrolling-footer-text"></p>
  </footer>

  <button id="fullscreen-button" class="fullscreen-button" aria-label="Toggle fullscreen" title="Toggle fullscreen">⛶</button>

  <button id="network-sync-button" class="network-sync-button" aria-label="Network sync settings" title="Network sync settings">⚙</button>

  <div id="network-sync-panel" class="network-sync-panel" hidden>
    <form id="network-sync-panel-form">
      <p class="network-sync-panel-explainer">
        Set this once per machine to connect to a Control Panel running on
        a different computer. Leave off for single-computer use.
      </p>
      <label class="checkbox-label">
        <input id="network-sync-panel-enabled" type="checkbox">
        Enable network sync
      </label>
      <label for="network-sync-panel-url">Relay server address</label>
      <input id="network-sync-panel-url" type="text" placeholder="ws://192.168.1.50:8080" autocomplete="off" spellcheck="false">
      <p id="network-sync-panel-status" class="network-sync-panel-status"></p>
      <div class="network-sync-panel-buttons">
        <button type="submit">Save &amp; Connect</button>
        <button type="button" id="network-sync-panel-close">Close</button>
      </div>
    </form>
  </div>

  <div id="audio-unlock-overlay" class="audio-unlock-overlay" role="button" tabindex="0">
    <p>Tap anywhere to enable announcement sound</p>
  </div>

  <audio id="bell-sound" src="assets/bell.mp3" preload="auto"></audio>

  <script type="module" src="js/comms.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/settings.js"></script>
  <script type="module" src="js/speech.js"></script>
  <script type="module" src="js/display.js"></script>
</body>
</html>
