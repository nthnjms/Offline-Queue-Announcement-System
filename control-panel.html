<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel — Queue Announcement System</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/control-panel.css">
</head>
<body>

  <!-- ==========================================================
       SKELETON ONLY (Chunk 0).
       Real inputs, buttons, history list, and settings form get
       built out in Chunk 4. This shell exists so the page loads,
       the CSS/JS files resolve, and later chunks have a known
       structure to attach to.
       ========================================================== -->

  <header class="app-header">
    <h1>Control Panel</h1>
    <!-- Chunk 1 will populate this with a live Display connection dot -->
    <div id="connection-status" class="connection-status" aria-live="polite">
      Display: checking…
    </div>
  </header>

  <main id="control-panel-main">
    <!-- Chunk 4: ticket number, counter, custom message, Call / Repeat / Clear -->
    <section id="call-section" class="card">
      <p class="placeholder-note">Call form goes here (Chunk 4)</p>
    </section>

    <!-- Chunk 4: last 5 announcements, click to recall -->
    <section id="history-section" class="card">
      <p class="placeholder-note">History list goes here (Chunk 4)</p>
    </section>

    <!-- Chunk 3/4: office name, logo, counters, theme, speech rate/volume, footer text -->
    <section id="settings-section" class="card">
      <p class="placeholder-note">Settings form goes here (Chunk 3 / 4)</p>
    </section>
  </main>

  <!-- Module scripts load in dependency order. type="module" gives us
       real imports/exports instead of relying on global script order. -->
  <script type="module" src="js/comms.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/settings.js"></script>
  <script type="module" src="js/control-panel.js"></script>
</body>
</html>
