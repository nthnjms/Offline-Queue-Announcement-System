<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel — Queue Announcement System</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/control-panel.css">
</head>
<body>

  <header class="app-header">
    <h1>Control Panel</h1>
    <div id="connection-status" class="connection-status" aria-live="polite">
      Display: checking…
    </div>
  </header>

  <main id="control-panel-main">

    <!-- ============ CALL FORM ============ -->
    <section class="card call-card" aria-labelledby="call-heading">
      <h2 id="call-heading" class="visually-hidden">Call a ticket</h2>

      <div id="now-showing" class="now-showing" aria-live="polite">
        <span class="now-showing-label">Currently on display</span>
        <span id="now-showing-value" class="now-showing-value">—</span>
      </div>

      <form id="call-form" novalidate>
        <div class="field">
          <label for="ticket-number">Ticket number</label>
          <input
            id="ticket-number"
            name="ticketNumber"
            type="text"
            class="ticket-input"
            placeholder="0000"
            autocomplete="off"
            spellcheck="false"
            maxlength="12"
          >
        </div>

        <div class="field">
          <label for="counter-select">Counter</label>
          <select id="counter-select" name="counter"></select>
        </div>

        <div class="field">
          <label for="custom-message">Custom announcement <span class="field-optional">(optional)</span></label>
          <textarea
            id="custom-message"
            name="message"
            rows="2"
            placeholder="Leave blank to auto-generate: “Ticket B015, please proceed to Counter 2.”"
          ></textarea>
        </div>

        <div class="button-row">
          <button type="submit" id="call-button" class="btn btn-primary">📢 Call</button>
          <button type="button" id="repeat-button" class="btn btn-secondary">🔁 Repeat</button>
          <button type="button" id="clear-button" class="btn btn-danger">🗑 Clear Display</button>
        </div>
      </form>
    </section>

    <!-- ============ HISTORY ============ -->
    <section class="card history-card" aria-labelledby="history-heading">
      <h2 id="history-heading">Last Called</h2>
      <ol id="history-list" class="history-list"></ol>
      <p id="history-empty" class="empty-note">No tickets called yet.</p>
    </section>

    <!-- ============ SETTINGS ============ -->
    <details class="card settings-card" id="settings-details">
      <summary>Settings</summary>

      <form id="settings-form">
        <div class="field">
          <label for="office-name-input">Office name</label>
          <input id="office-name-input" type="text" maxlength="80">
        </div>

        <div class="field">
          <label for="logo-input">Office logo</label>
          <div class="logo-row">
            <img id="logo-preview" alt="Office logo preview" hidden>
            <input id="logo-input" type="file" accept="image/*">
            <button type="button" id="remove-logo-button" class="btn btn-text" hidden>Remove logo</button>
          </div>
        </div>

        <div class="field">
          <label for="counter-count-input">Number of counters</label>
          <input id="counter-count-input" type="number" min="1" max="20" step="1">
        </div>

        <div class="field">
          <label for="theme-color-input">Theme color</label>
          <div class="theme-color-row">
            <input id="theme-color-input" type="color">
            <input id="theme-color-text" type="text" maxlength="7" class="theme-color-text" aria-label="Theme color hex value">
          </div>
        </div>

        <div class="field">
          <label for="speech-rate-input">Speech rate <span id="speech-rate-readout" class="readout"></span></label>
          <input id="speech-rate-input" type="range" min="0.5" max="2" step="0.1">
        </div>

        <div class="field">
          <label for="speech-volume-input">Speech volume <span id="speech-volume-readout" class="readout"></span></label>
          <input id="speech-volume-input" type="range" min="0" max="1" step="0.05">
        </div>

        <div class="field">
          <label for="footer-message-input">Footer scrolling message <span class="field-optional">(optional)</span></label>
          <input id="footer-message-input" type="text" maxlength="200">
        </div>

        <p id="settings-warning" class="field-hint" hidden></p>
        <p id="settings-saved-note" class="saved-note" aria-live="polite" hidden>Saved.</p>

        <div class="button-row">
          <button type="submit" class="btn btn-primary">Save Settings</button>
          <button type="button" id="reset-settings-button" class="btn btn-secondary">Reset to Defaults</button>
          <button type="button" id="export-settings-button" class="btn btn-text">Export…</button>
          <button type="button" id="import-settings-button" class="btn btn-text">Import…</button>
          <input type="file" id="import-settings-file" accept="application/json" hidden>
        </div>
      </form>
    </details>
  </main>

  <script type="module" src="js/comms.js"></script>
  <script type="module" src="js/state.js"></script>
  <script type="module" src="js/settings.js"></script>
  <script type="module" src="js/control-panel.js"></script>
</body>
</html>
